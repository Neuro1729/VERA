spring.application.name=resource-entitlement-engine
server.port=8080
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false

vera.security.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${VERA_SESSION_COOKIE_SECURE:false}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/entitlements}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
